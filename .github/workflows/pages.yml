name: Deploy Training Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify synthetic mock data & build dashboard
        run: |
          python labs/generate_mock_data.py
          python labs/session1_traffic_monitor/analyze_traffic_and_alerts.py
          python labs/session2_crime_investigation/laundering_and_call_detector.py
          python labs/session3_bigdata_reapplication/alert_110_mining_and_dashboard.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
